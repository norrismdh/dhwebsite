<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <title>Client health - Ops - Digital Hive</title>
  <!-- No marketing nav/footer on ops pages - ops has its own chrome -->
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/site.css" />
  <link rel="stylesheet" href="../styles/dhadmin.css" />
  <link rel="stylesheet" href="../styles/ops.css" />
</head>
<body>

  <!-- ============================================================
       AUTH LOADING - shown while MSAL initialises / redirecting
       ============================================================ -->
  <div id="ops-loading" class="admin-loading" role="status" aria-live="polite">
    <div class="admin-loading__spinner" aria-hidden="true"></div>
    <p id="ops-loading-msg">Authenticating&hellip;</p>
  </div>

  <!-- ============================================================
       OPS APP - hidden until auth confirmed
       ============================================================ -->
  <div id="ops-app" hidden>

    <!-- Top bar -->
    <header class="admin-topbar">
      <div class="admin-topbar__inner">

        <div class="admin-topbar__brand">
          <img src="../assets/logo-reversed.svg" alt="Digital Hive" height="40" />
          <span class="admin-topbar__brand-title">Ops</span>
        </div>

        <nav class="admin-nav" aria-label="Ops">
          <a href="/ops" class="admin-nav__item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Dashboard
          </a>
          <a href="/ops/support" class="admin-nav__item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Support
          </a>
          <a href="/ops/clients" class="admin-nav__item is-active" aria-current="page">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Clients
          </a>
        </nav>

        <div class="admin-topbar__user">
          <span id="ops-user-email" class="admin-user-email" aria-label="Signed in as"></span>
          <button id="ops-signout" class="admin-signout-btn" type="button">Sign out</button>
        </div>

      </div>
    </header>

    <!-- Main content -->
    <main class="admin-main" id="ops-content">
      <div class="container">

        <!-- Page header -->
        <div class="admin-page-head">
          <h1>Client health <span id="ops-demo-badge" class="ops-badge" hidden>Demo data</span></h1>

          <div class="ops-controls">
            <button type="button" id="ops-refresh" class="btn btn--primary ops-refresh">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              Refresh data
            </button>

            <span id="ops-updated" class="ops-updated"></span>
          </div>
        </div>

        <!-- How health is derived -->
        <p class="ops-note" id="ops-method" style="margin-top:calc(-1 * var(--space-4));margin-bottom:var(--space-6)"></p>

        <!-- Config / error state (hidden unless needed) -->
        <div id="ops-state" class="ops-state" hidden></div>

        <!-- Summary KPIs (populated by JS) -->
        <div class="admin-stats" id="ops-kpis" aria-live="polite"></div>

        <!-- Client table -->
        <div class="admin-panel ops-panel-full">
          <div class="admin-panel__head">
            <h2>Clients</h2>
            <span id="ops-client-count" class="ops-updated"></span>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table" aria-label="Client health">
              <thead>
                <tr>
                  <th>Client</th>
                  <th>Health</th>
                  <th>Last contact</th>
                  <th>Via</th>
                  <th>Owner</th>
                  <th class="ops-num">Open tickets</th>
                  <th>Next renewal</th>
                  <th class="ops-num">Lifetime value</th>
                </tr>
              </thead>
              <tbody id="ops-clients"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

  </div><!-- /ops-app -->

  <script type="module" src="../scripts/ops-clients.js"></script>

</body>
</html>
